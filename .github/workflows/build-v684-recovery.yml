name: Build v6.8.4 Recovery ZIP
on:
  push:
    branches:
      - package/v6.8.4-recovery
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build recovery package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          # Version marker.
          Path('version.json').write_text(json.dumps({
              'version': '6.8.4',
              'label': 'TripSpend v6.8.4'
          }, indent=2) + '\n')

          # Main app: keep all v6.8.3 features, but stop registering a service worker.
          p = Path('app.js')
          s = p.read_text()
          s = s.replace('const APP_VERSION = "6.8.3";', 'const APP_VERSION = "6.8.4";')
          marker = 'if ("serviceWorker" in navigator) {\n    addEventListener("load", async () => {'
          assert marker in s, 'service worker registration block not found'
          s = s.replace(marker, 'if (false && "serviceWorker" in navigator) {\n    addEventListener("load", async () => {', 1)
          s = s.replace('./sw.js?v=6.8.3-manual1', './sw.js?v=6.8.4')
          p.write_text(s)

          # HTML: force fresh asset URLs, directly load AI, and safely unregister stale PWA caches.
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('6.8.3-manual1', '6.8.4')
          s = s.replace('6.8.3', '6.8.4')

          old_tail = '''<script src="app.js?v=6.8.4"></script>\n<script src="fx.js?v=6.8.4"></script>\n<script src="v5.js?v=6.8.4"></script>\n<script src="i18n.js?v=6.8.4"></script>'''
          assert old_tail in s, 'script tail not found'

          recovery = '''<script>\n(() => {\n  const standalone = window.matchMedia?.("(display-mode: standalone)")?.matches || window.navigator.standalone === true;\n  if (!standalone || !("serviceWorker" in navigator)) return;\n  const marker = "tripspend.pwa.recovery.684";\n  if (sessionStorage.getItem(marker)) return;\n  sessionStorage.setItem(marker, "1");\n  addEventListener("DOMContentLoaded", async () => {\n    try {\n      const registrations = await navigator.serviceWorker.getRegistrations();\n      await Promise.all(registrations.map(registration => registration.unregister()));\n    } catch {}\n    try {\n      const keys = await caches.keys();\n      await Promise.all(keys.filter(key => key.startsWith("tripspend-")).map(key => caches.delete(key)));\n    } catch {}\n    const url = new URL(location.href);\n    url.searchParams.set("recovery", "684");\n    location.replace(url.toString());\n  }, { once: true });\n})();\n</script>\n<script src="app.js?v=6.8.4"></script>\n<script src="fx.js?v=6.8.4"></script>\n<script src="v5.js?v=6.8.4"></script>\n<script src="ai.js?v=6.8.4"></script>\n<script src="i18n.js?v=6.8.4"></script>'''
          s = s.replace(old_tail, recovery, 1)
          p.write_text(s)

          # Self-destructing SW: if iOS checks an older registration, it removes itself and only cache storage.
          Path('sw.js').write_text('''const CACHE_PREFIX = "tripspend-";\n\nself.addEventListener("install", event => {\n  self.skipWaiting();\n});\n\nself.addEventListener("activate", event => {\n  event.waitUntil((async () => {\n    try {\n      const keys = await caches.keys();\n      await Promise.all(keys.filter(key => key.startsWith(CACHE_PREFIX)).map(key => caches.delete(key)));\n    } catch {}\n    try { await self.registration.unregister(); } catch {}\n    try { await self.clients.claim(); } catch {}\n  })());\n});\n\n// Intentionally no fetch handler. v6.8.4 recovery runs network-first and preserves IndexedDB/localStorage.\n''')
          PY

          node --check app.js
          node --check fx.js
          node --check v5.js
          node --check ai.js
          node --check i18n.js
          node --check sw.js

          rm -rf package
          mkdir -p package/icons
          cp index.html style.css dashboard.css app.js fx.js v5.js ai.js i18n.js ai-config.json manifest.webmanifest version.json sw.js package/
          cp icons/icon-96.png icons/icon-180.png icons/icon-192.png icons/icon-512.png package/icons/
          cat > package/UPLOAD_INSTRUCTIONS.txt <<'EOF'
          TRIPSPEND v6.8.4 RECOVERY

          1. Unzip this package.
          2. Open GitHub -> alsakiti/TripSpend -> main.
          3. Add file -> Upload files.
          4. Upload ALL files and the icons folder INSIDE this package to the repository root.
          5. Commit directly to main.
          6. Wait for GitHub Pages deployment to finish.
          7. Fully close the TripSpend Home Screen app and reopen it while online.

          IMPORTANT:
          - Do NOT clear Safari/site data.
          - Do NOT delete IndexedDB/localStorage.
          - This recovery build intentionally disables the service worker/offline cache.
          - It keeps Arabic/English UI, AI client features, and your locally stored trip data.
          - Cloudflare Worker deployment is separate and is not included in this GitHub Pages package.
          EOF
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: TripSpend-v6.8.4-recovery
          path: package/
          retention-days: 30
