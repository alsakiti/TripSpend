name: TripSpend Home Screen Recovery
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply recovery patch
        run: |
          base64 -d .github/scripts/pwa_recovery_patch.b64 > /tmp/pwa_patch.py
          python3 /tmp/pwa_patch.py
          node --check app.js
          node --check sw.js
          git config user.name "TripSpend Recovery"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/scripts/pwa_recovery_patch.b64
          git rm .github/workflows/pwa-storage-recovery-v682b.yml
          git add app.js index.html sw.js
          git commit -m "Add Home Screen storage boot watchdog"
          git push origin HEAD:main
