name: TripSpend Quality

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mark quality pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"TripSpend Quality\",\"description\":\"Quality checks are running\",\"target_url\":\"${RUN_URL}\"}"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: JavaScript syntax checks
        run: |
          node --check app.js
          node --check v5.js
          node --check fx.js
          node --check ai-v684.js
          node --check sw.js
          node --check locale-v700.js
          node --check locale-dynamic-v700.js
          node --check expense-locale-v703.js
          node --check page-locale-v704.js
          node --check setup-language-host-v700.js
          node --check receipt-capability-v700.js
          node --check receipt-ai-v700.js
          node --check ai-intelligence-v720.js
          node --input-type=module --check < worker/ai-worker.js
          node --input-type=module --check < worker/ai-worker-v701.js
          node --input-type=module --check < worker/ai-worker-v702.js
          node --input-type=module --check < worker/ai-worker-v703.js

      - name: AI Worker contract tests
        run: node worker/ai-worker-contract.test.mjs

      - name: Release consistency checks
        run: node tests/static-check.mjs

      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.62.0

      - name: Verify CI browser
        run: google-chrome --version

      - name: Run UI smoke tests
        run: npx playwright test --workers=1
        env:
          CI: "true"

      - name: Upload UI report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: tripspend-ui-quality
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Publish quality result
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "${JOB_STATUS}" = "success" ]; then
            STATE="success"
            DESCRIPTION="All TripSpend quality checks passed"
          else
            STATE="failure"
            DESCRIPTION="One or more TripSpend quality checks failed"
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"TripSpend Quality\",\"description\":\"${DESCRIPTION}\",\"target_url\":\"${RUN_URL}\"}"
